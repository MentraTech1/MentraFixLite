<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <title>MentraFix Lite - بوابة الدخول والتأسيس</title>
    <link rel="icon" href="assets/logo.png">
    
    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="assets/Tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React, ReactDOM, Babel & Dexie -->
    <script crossorigin src="assets/react.production.min.js"></script>
    <script crossorigin src="assets/react-dom.production.min.js"></script>
    <script src="assets/babel.min.js"></script>
    <script src="assets/dexie.min.js"></script>
    
    <!-- قاعدة البيانات -->
    <script src="database.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0F172A; 
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* أشكال الخلفية */
        .bg-shapes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.22; animation: float 20s infinite alternate; }
        .shape-1 { background: #06B6D4; width: 380px; height: 380px; top: -100px; right: -100px; }
        .shape-2 { background: #3B82F6; width: 320px; height: 320px; bottom: -60px; left: -60px; animation-delay: -5s; }
        .shape-3 { background: #8B5CF6; width: 250px; height: 250px; top: 40%; left: 30%; animation-delay: -10s; opacity: 0.12; }
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 45px) scale(1.08); } }

        /* حقول الإدخال */
        .input-group { position: relative; transition: all 0.3s ease; }
        .input-field {
            width: 100%; padding: 0.95rem 1rem 0.95rem 3rem; border-radius: 1rem;
            border: 2px solid #E2E8F0; background: #F8FAFC; outline: none;
            color: #1E293B; font-weight: 700; font-size: 0.95rem; transition: all 0.25s ease;
        }
        .input-field:focus { border-color: #06B6D4; background: #FFFFFF; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.15); }
        .input-icon { position: absolute; top: 50%; left: 1.25rem; transform: translateY(-50%); color: #94A3B8; transition: all 0.25s ease; font-size: 1rem; }
        .input-field:focus ~ .input-icon { color: #06B6D4; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .fade-up { animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="relative flex flex-col justify-between min-h-screen">
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- زر العودة للرئيسية -->
    <a href="index.html" class="absolute top-4 left-4 sm:top-6 sm:left-6 z-50 flex items-center gap-2 text-white/80 hover:text-white transition-colors text-xs sm:text-sm font-bold bg-white/5 hover:bg-white/10 px-3.5 py-2 rounded-xl backdrop-blur-md border border-white/10 shadow-sm active:scale-95">
        <i class="fas fa-arrow-left"></i> <span>الرئيسية</span>
    </a>

    <!-- شاشة التحميل الأولية -->
    <div id="sub-loader" style="position:fixed;inset:0;background:#0F172A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.4s ease;">
        <div style="width:58px;height:58px;background:linear-gradient(135deg,#06B6D4,#3B82F6);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 25px rgba(6,182,212,0.4)">
            <img src="assets/logo.png" alt="اللوجو" class="h-13 w-auto" />
        </div>
        <div style="width:44px;height:44px;border:3px solid rgba(255,255,255,0.1);border-top-color:#06B6D4;border-radius:50%;animation:spin2 0.8s linear infinite;"></div>
        <p style="margin-top:14px;font-family:system-ui,sans-serif;font-weight:800;color:#94A3B8;font-size:13px">تحميل نظام الصيانة...</p>
    </div>
    <style>@keyframes spin2{to{transform:rotate(360deg);}}</style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var loader = document.getElementById("sub-loader");
            var root = document.getElementById("root");
            if (!root) return;
            var obs = new MutationObserver(function(){
                if(root.children.length > 0){
                    loader.style.opacity = '0';
                    loader.style.pointerEvents = 'none';
                    setTimeout(function(){ loader.remove(); }, 400);
                    obs.disconnect();
                }
            });
            obs.observe(root, {childList: true});
        });
    </script>
    
    <!-- الحاوية الأساسية لـ React -->
    <main id="root" class="relative z-10 flex items-center justify-center min-h-screen p-3 sm:p-6 w-full"></main>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const roleBadges = {
            'admin': { label: 'مدير المركز', color: 'bg-purple-50 text-purple-700 border-purple-200' },
            'technician': { label: 'مهندس / فني', color: 'bg-blue-50 text-blue-700 border-blue-200' },
            'reception': { label: 'موظف استقبال', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
        };

        function SubscriptionsApp() {
            const [isChecking, setIsChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('login'); 
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            const [availableCenters, setAvailableCenters] = useState([]);
            const [selectedDbForLogin, setSelectedDbForLogin] = useState('');

            // حالات الحسابات المسجلة والـ Live Search
            const [savedUsers, setSavedUsers] = useState([]);
            const [selectedSavedUser, setSelectedSavedUser] = useState(null);
            const [fastLoginPassword, setFastLoginPassword] = useState('');
            const [accountSearchQuery, setAccountSearchQuery] = useState('');
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const searchInputRef = useRef(null);

            // حالات استعادة الحساب بمفتاح الأمان (Security Key Recovery)
            const [isRecoveryOpen, setIsRecoveryOpen] = useState(false);
            const [recoveryKey, setRecoveryKey] = useState('');
            const [recoveryNewPassword, setRecoveryNewPassword] = useState('');
            const [recoveryConfirmPassword, setRecoveryConfirmPassword] = useState('');
            const [recoveryError, setRecoveryError] = useState('');
            const [recoverySuccess, setRecoverySuccess] = useState('');
            const [recoveryLoading, setRecoveryLoading] = useState(false);

            const [formData, setFormData] = useState({
                centerName: '', ownerName: '', phone: '', password: ''
            });

            useEffect(() => {
                const initApp = async () => {
                    try {
                        const activeSession = localStorage.getItem('MentraFix_Session');
                        if (activeSession) {
                            window.location.replace('dashboard.html');
                            return;
                        }

                        await window.masterDb.open();
                        const centersList = await window.masterDb.centers.toArray();
                        setAvailableCenters(centersList);

                        if (centersList.length > 0) {
                            setSelectedDbForLogin(centersList[0].dbName);
                            
                            let allUsers = [];
                            for (let center of centersList) {
                                try {
                                    await window.initCenterDB(center.dbName);
                                    const users = await window.db.users.toArray();
                                    users.forEach(u => allUsers.push({ 
                                        ...u, 
                                        center_name: center.centerName, 
                                        dbName: center.dbName,
                                        center_id: center.id
                                    }));
                                } catch (e) {
                                    console.warn("تعذر فتح قاعدة بيانات المركز:", center.centerName);
                                }
                            }

                            if (allUsers.length > 0) {
                                setSavedUsers(allUsers);
                                const lastUserId = localStorage.getItem('MentraFix_LastUserID');
                                const defaultUser = allUsers.find(u => String(u.id) === String(lastUserId)) || allUsers[0];
                                setSelectedSavedUser(defaultUser);
                                setActiveTab('fast-login');
                            }
                        }

                        setTimeout(() => setIsChecking(false), 600);
                    } catch (err) {
                        console.error("خطأ في التهيئة:", err);
                        setIsChecking(false);
                    }
                };
                initApp();
            }, []);

            // تصفية الحسابات لايف (Live Filter)
            const filteredUsers = useMemo(() => {
                const q = accountSearchQuery.trim().toLowerCase();
                if (!q) return savedUsers;
                return savedUsers.filter(u => 
                    (u.name && u.name.toLowerCase().includes(q)) ||
                    (u.phone && u.phone.includes(q)) ||
                    (u.center_name && u.center_name.toLowerCase().includes(q))
                );
            }, [savedUsers, accountSearchQuery]);

            const handleChange = (e) => { 
                setFormData({ ...formData, [e.target.name]: e.target.value }); 
                setError(''); 
            };

            // تسجيل الدخول العادي
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { user, center, dbName } = await window.CenterQueries.login(selectedDbForLogin, formData.phone, formData.password);
                    
                    localStorage.setItem('MentraFix_Session', JSON.stringify({
                        user_id: user.id, center_id: center.id, name: user.name, role: user.role, center_name: center.name, dbName: dbName
                    }));
                    localStorage.setItem('MentraFix_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { 
                    setError(err.message || "بيانات الدخول غير صحيحة"); 
                    setLoading(false); 
                }
            };

            // الدخول السريع
            const handleFastLogin = async (e) => {
                e.preventDefault();
                if (!selectedSavedUser) return;
                if (!fastLoginPassword) { setError("الرجاء إدخال كلمة المرور"); return; }

                setLoading(true); setError('');
                try {
                    const { user, center, dbName } = await window.CenterQueries.login(selectedSavedUser.dbName, selectedSavedUser.phone, fastLoginPassword);
                    
                    localStorage.setItem('MentraFix_Session', JSON.stringify({
                        user_id: user.id, center_id: center.id, name: user.name, role: user.role, center_name: center.name, dbName: dbName
                    }));
                    localStorage.setItem('MentraFix_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { 
                    setError(err.message || "كلمة المرور غير صحيحة"); 
                    setLoading(false); 
                }
            };

            // تأسيس مركز جديد
            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                try {
                    const { centerId, userId, dbName } = await window.CenterQueries.createCenter(
                        formData.centerName, formData.ownerName, formData.phone, formData.password
                    );

                    localStorage.setItem('MentraFix_Session', JSON.stringify({
                        user_id: userId, center_id: centerId, name: formData.ownerName, role: 'admin', center_name: formData.centerName, dbName: dbName
                    }));
                    localStorage.setItem('MentraFix_LastUserID', userId);
                    window.location.replace('dashboard.html');
                } catch (err) { 
                    setError(err.message || "حدث خطأ غير متوقع أثناء التأسيس"); 
                    setLoading(false); 
                }
            };

            // معالجة استعادة كلمة المرور بمفتاح الأمان (Offline Security Key Recovery)
            const handleSecurityKeyRecovery = async (e) => {
                e.preventDefault();
                setRecoveryError('');
                setRecoverySuccess('');

                const cleanKey = recoveryKey.trim().toUpperCase();
                if (cleanKey.length < 8) {
                    setRecoveryError("يرجى إدخال مفتاح أمان صالح");
                    return;
                }
                if (recoveryNewPassword.length < 4) {
                    setRecoveryError("كلمة المرور الجديدة يجب ألا تقل عن 4 خانات");
                    return;
                }
                if (recoveryNewPassword !== recoveryConfirmPassword) {
                    setRecoveryError("كلمتا المرور غير متطابقتين");
                    return;
                }

                setRecoveryLoading(true);

                try {
                    let matchedUser = null;
                    let targetCenter = null;

                    // إذا كان الحساب محدداً في الدخول السريع، نتحقق منه أولاً
                    if (selectedSavedUser) {
                        await window.initCenterDB(selectedSavedUser.dbName);
                        const userInDb = await window.db.users.get(parseInt(selectedSavedUser.id));
                        if (userInDb && userInDb.security_key && userInDb.security_key.trim().toUpperCase() === cleanKey) {
                            matchedUser = userInDb;
                            targetCenter = { dbName: selectedSavedUser.dbName, centerName: selectedSavedUser.center_name, id: selectedSavedUser.center_id };
                        }
                    }

                    // إذا لم يتطابق، نبحث في كل مراكز الجهاز
                    if (!matchedUser) {
                        for (let center of availableCenters) {
                            await window.initCenterDB(center.dbName);
                            const users = await window.db.users.toArray();
                            const found = users.find(u => u.security_key && u.security_key.trim().toUpperCase() === cleanKey);
                            if (found) {
                                matchedUser = found;
                                targetCenter = center;
                                break;
                            }
                        }
                    }

                    if (!matchedUser) {
                        throw new Error("مفتاح الأمان المدخل غير صحيح أو لم يتم تعيينه لهذا الحساب مسبقاً");
                    }

                    // تشفير كلمة المرور الجديدة وتحديثها في قاعدة البيانات
                    const encoder = new TextEncoder();
                    const data = encoder.encode(recoveryNewPassword);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    const hashedPassword = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                    await window.initCenterDB(targetCenter.dbName);
                    await window.db.users.update(matchedUser.id, {
                        password: hashedPassword,
                        updated_at: new Date().toISOString()
                    });

                    setRecoverySuccess(`تم تغيير كلمة المرور بنجاح لحساب (${matchedUser.name})!`);
                    
                    // تحديث الحساب المختار وتعبئة كلمة المرور تلقائياً
                    setTimeout(() => {
                        setIsRecoveryOpen(false);
                        setRecoveryKey('');
                        setRecoveryNewPassword('');
                        setRecoveryConfirmPassword('');
                        setFastLoginPassword(recoveryNewPassword);
                        setError('');
                        if (targetCenter) {
                            setSelectedSavedUser({ ...matchedUser, center_name: targetCenter.centerName, dbName: targetCenter.dbName });
                            setActiveTab('fast-login');
                        }
                    }, 1500);

                } catch (err) {
                    setRecoveryError(err.message || "فشلت عملية التحقق من مفتاح الأمان");
                } finally {
                    setRecoveryLoading(false);
                }
            };

            const selectUser = (u) => {
                setSelectedSavedUser(u);
                setFastLoginPassword('');
                setError('');
                setIsSearchOpen(false);
                setAccountSearchQuery('');
            };

            if (isChecking) {
                return (
                    <div className="flex flex-col items-center justify-center fade-up">
                        <div className="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-[#06B6D4] to-[#3B82F6] rounded-2xl flex items-center justify-center text-white text-3xl sm:text-4xl shadow-xl shadow-cyan-500/25 animate-pulse mb-5">
                            <img src="assets/logo.png" alt="اللوجو" class="h-13 w-auto" />
                        </div>
                        <h2 className="text-xl sm:text-2xl font-black text-white">جاري تهيئة النظام...</h2>
                    </div>
                );
            }

            return (
                <div className="w-full max-w-[440px] mx-auto fade-up">
                    {/* الشعار والهيدر */}
                    <div className="text-center mb-6 sm:mb-8">
                        <div className="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-br from-[#06B6D4] to-[#3B82F6] mx-auto rounded-2xl flex items-center justify-center text-white text-2xl sm:text-3xl shadow-lg shadow-cyan-500/30 mb-3">
                            <img src="assets/logo.png" alt="اللوجو" class="h-13 w-auto" />
                        </div>
                        <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight mb-1">
                            MentraFix<span className="text-[#06B6D4] drop-shadow-[0_0_10px_rgba(6,182,212,0.5)] mr-1">Lite</span>
                        </h1>
                        <p className="text-slate-400 font-bold text-xs sm:text-sm">نظام الإدارة الذكي لمراكز الصيانة (أوفلاين)</p>
                    </div>

                    {/* الكارت الرئيسي */}
                    <div className="bg-white rounded-[2rem] shadow-2xl overflow-hidden relative border border-slate-100">
                        {/* شريط التبويبات العلوي */}
                        {activeTab !== 'fast-login' && (
                            <div className="flex p-1.5 sm:p-2 bg-slate-50 border-b border-slate-100">
                                <button 
                                    onClick={() => { setActiveTab('login'); setError(''); }} 
                                    className={`flex-1 py-2.5 sm:py-3 text-xs sm:text-sm font-black rounded-xl transition-all ${
                                        activeTab === 'login' ? 'bg-white text-[#06B6D4] shadow-sm' : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    تسجيل الدخول
                                </button>
                                <button 
                                    onClick={() => { setActiveTab('register'); setError(''); }} 
                                    className={`flex-1 py-2.5 sm:py-3 text-xs sm:text-sm font-black rounded-xl transition-all ${
                                        activeTab === 'register' ? 'bg-white text-[#06B6D4] shadow-sm' : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    تأسيس مركز جديد
                                </button>
                            </div>
                        )}

                        <div className="p-5 sm:p-8">
                            {/* رسالة الخطأ العامة */}
                            {error && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-600 p-3.5 rounded-2xl text-xs font-bold mb-5 flex items-start gap-2.5 fade-up">
                                    <i className="fas fa-exclamation-circle text-base mt-0.5 shrink-0"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            {/* ================= 1. الدخول السريع مع اللايف سيرش ================= */}
                            {activeTab === 'fast-login' && selectedSavedUser && (
                                <div className="space-y-5 fade-up text-center">
                                    
                                    {/* بطاقة الحساب المختار مع زر التبديل والبحث */}
                                    <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-3.5 text-right relative transition-all">
                                        <div className="flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-[#06B6D4] to-[#3B82F6] text-white flex items-center justify-center font-black text-lg shadow-md shrink-0">
                                                    {selectedSavedUser.name ? selectedSavedUser.name.charAt(0) : <i className="fas fa-user"></i>}
                                                </div>
                                                <div className="overflow-hidden">
                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                        <h3 className="font-black text-slate-800 text-sm sm:text-base truncate leading-snug">
                                                            {selectedSavedUser.name}
                                                        </h3>
                                                        {selectedSavedUser.role && roleBadges[selectedSavedUser.role] && (
                                                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded border ${roleBadges[selectedSavedUser.role].color}`}>
                                                                {roleBadges[selectedSavedUser.role].label}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <p className="text-[11px] font-bold text-slate-500 truncate mt-0.5">
                                                        <i className="fas fa-store text-cyan-600 ml-1"></i> {selectedSavedUser.center_name}
                                                    </p>
                                                </div>
                                            </div>

                                            {/* زر فتح اللايف سيرش */}
                                            {savedUsers.length > 1 && (
                                                <button 
                                                    type="button" 
                                                    onClick={() => {
                                                        setIsSearchOpen(!isSearchOpen);
                                                        setTimeout(() => searchInputRef.current && searchInputRef.current.focus(), 100);
                                                    }}
                                                    className="shrink-0 bg-white hover:bg-cyan-50 border border-slate-200 hover:border-cyan-200 text-slate-600 hover:text-cyan-700 px-2.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm active:scale-95"
                                                    title="تبديل الحساب أو البحث"
                                                >
                                                    <i className="fas fa-magnifying-glass text-cyan-600 text-[11px]"></i>
                                                    <span className="hidden sm:inline">تبديل</span>
                                                    <i className={`fas fa-chevron-${isSearchOpen ? 'up' : 'down'} text-[10px] text-slate-400`}></i>
                                                </button>
                                            )}
                                        </div>

                                        {/* دروب داون لايف سيرش للحسابات (Live Search Box) */}
                                        {isSearchOpen && (
                                            <div className="mt-3 pt-3 border-t border-slate-200/70 animate-view">
                                                <div className="relative mb-2">
                                                    <input 
                                                        ref={searchInputRef}
                                                        type="text" 
                                                        value={accountSearchQuery}
                                                        onChange={(e) => setAccountSearchQuery(e.target.value)}
                                                        placeholder="ابحث بالاسم، المركز أو الهاتف..."
                                                        className="w-full bg-white border border-slate-200 text-slate-800 text-xs font-bold rounded-xl py-2.5 pr-8 pl-8 focus:outline-none focus:border-cyan-500 transition-all shadow-inner"
                                                    />
                                                    <i className="fas fa-search absolute top-1/2 right-3 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                    {accountSearchQuery && (
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setAccountSearchQuery('')}
                                                            className="absolute top-1/2 left-3 -translate-y-1/2 text-slate-400 hover:text-rose-500"
                                                        >
                                                            <i className="fas fa-times-circle text-xs"></i>
                                                        </button>
                                                    )}
                                                </div>

                                                {/* قائمة الحسابات المفلترة */}
                                                <div className="max-h-48 overflow-y-auto space-y-1.5 hide-scrollbar pr-0.5">
                                                    {filteredUsers.length > 0 ? (
                                                        filteredUsers.map((u) => {
                                                            const isSelected = selectedSavedUser.id === u.id && selectedSavedUser.dbName === u.dbName;
                                                            return (
                                                                <div 
                                                                    key={`${u.dbName}-${u.id}`}
                                                                    onClick={() => selectUser(u)}
                                                                    className={`p-2 rounded-xl flex items-center justify-between gap-2 cursor-pointer transition-all border ${
                                                                        isSelected 
                                                                            ? 'bg-cyan-50/80 border-cyan-300 text-cyan-900' 
                                                                            : 'bg-white hover:bg-slate-100/70 border-slate-100 text-slate-700'
                                                                    }`}
                                                                >
                                                                    <div className="flex items-center gap-2 overflow-hidden">
                                                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-black text-xs shrink-0 ${
                                                                            isSelected ? 'bg-cyan-600 text-white' : 'bg-slate-200 text-slate-600'
                                                                        }`}>
                                                                            {u.name ? u.name.charAt(0) : <i className="fas fa-user"></i>}
                                                                        </div>
                                                                        <div className="overflow-hidden text-right">
                                                                            <p className="font-black text-xs truncate leading-tight">{u.name}</p>
                                                                            <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                                                                <i className="fas fa-store text-[9px] mr-0.5 text-cyan-500"></i> {u.center_name}
                                                                            </p>
                                                                        </div>
                                                                    </div>

                                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                                        {u.role && roleBadges[u.role] && (
                                                                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded border ${roleBadges[u.role].color}`}>
                                                                                {roleBadges[u.role].label}
                                                                            </span>
                                                                        )}
                                                                        {isSelected && (
                                                                            <i className="fas fa-check-circle text-cyan-600 text-xs mr-1"></i>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                    ) : (
                                                        <div className="p-4 text-center text-xs font-bold text-slate-400">
                                                            <i className="fas fa-user-slash block text-base mb-1 text-slate-300"></i>
                                                            لا يوجد حساب مطابق للبحث
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* نموذج كلمة المرور للدخول السريع */}
                                    <form onSubmit={handleFastLogin} className="space-y-4">
                                        <div className="input-group relative text-right">
                                            <input 
                                                type={showPassword ? "text" : "password"} 
                                                value={fastLoginPassword} 
                                                onChange={(e) => setFastLoginPassword(e.target.value)} 
                                                required 
                                                dir="ltr" 
                                                className="input-field text-left placeholder:text-right pr-12" 
                                                placeholder="كلمة المرور" 
                                                autoFocus
                                            />
                                            <i className="fas fa-lock input-icon"></i>
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPassword(!showPassword)}
                                                className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-cyan-600 transition"
                                            >
                                                <i className={`fas fa-eye${showPassword ? '-slash' : ''}`}></i>
                                            </button>
                                        </div>

                                        {/* زر نسيت كلمة المرور بمفتاح الأمان */}
                                        <div className="flex items-center justify-between text-xs font-bold px-1">
                                            <button 
                                                type="button" 
                                                onClick={() => {
                                                    setIsRecoveryOpen(true);
                                                    setRecoveryError('');
                                                    setRecoverySuccess('');
                                                }}
                                                className="text-violet-600 hover:text-violet-700 transition flex items-center gap-1 active:scale-95"
                                            >
                                                <i className="fas fa-key text-[10px]"></i>
                                                <span>استعادة الحساب بمفتاح الأمان؟</span>
                                            </button>
                                        </div>

                                        <button 
                                            type="submit" 
                                            disabled={loading} 
                                            className="w-full bg-gradient-to-l from-[#06B6D4] to-[#3B82F6] hover:opacity-95 text-white font-black py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-cyan-500/30 transition-all flex justify-center items-center gap-2 text-base sm:text-lg active:scale-95 disabled:opacity-50"
                                        >
                                            {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-bolt"></i>}
                                            <span>فتح النظام</span>
                                        </button>

                                        <button 
                                            type="button" 
                                            onClick={() => setActiveTab('login')} 
                                            className="w-full text-slate-500 hover:text-slate-800 font-bold text-xs sm:text-sm pt-1 transition"
                                        >
                                            الدخول برقم هاتف أو حساب آخر
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* ================= 2. تسجيل الدخول العادي ================= */}
                            {activeTab === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4 fade-up">
                                    {availableCenters.length > 0 ? (
                                        <div className="input-group">
                                            <select 
                                                value={selectedDbForLogin} 
                                                onChange={(e) => setSelectedDbForLogin(e.target.value)} 
                                                className="input-field pr-12 appearance-none cursor-pointer text-slate-700 font-bold" 
                                                required
                                            >
                                                {availableCenters.map(c => (
                                                    <option key={c.dbName} value={c.dbName}>{c.centerName}</option>
                                                ))}
                                            </select>
                                            <i className="fas fa-store input-icon"></i>
                                            <i className="fas fa-chevron-down absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                                        </div>
                                    ) : (
                                        <div className="text-center p-3.5 bg-cyan-50 text-cyan-800 rounded-xl text-xs font-bold border border-cyan-100">
                                            لا توجد مراكز صيانة مسجلة على هذا الجهاز، قم بالتأسيس أولاً.
                                        </div>
                                    )}

                                    <div className="input-group">
                                        <input 
                                            type="tel" 
                                            name="phone" 
                                            value={formData.phone} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right" 
                                            placeholder="رقم الهاتف" 
                                            disabled={availableCenters.length === 0} 
                                        />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>

                                    <div className="input-group relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            name="password" 
                                            value={formData.password} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-12" 
                                            placeholder="كلمة المرور" 
                                            disabled={availableCenters.length === 0} 
                                        />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-cyan-600 transition"
                                        >
                                            <i className={`fas fa-eye${showPassword ? '-slash' : ''}`}></i>
                                        </button>
                                    </div>

                                    {/* زر نسيت كلمة المرور بمفتاح الأمان */}
                                    <div className="flex items-center justify-between text-xs font-bold px-1">
                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                setIsRecoveryOpen(true);
                                                setRecoveryError('');
                                                setRecoverySuccess('');
                                            }}
                                            className="text-violet-600 hover:text-violet-700 transition flex items-center gap-1 active:scale-95"
                                        >
                                            <i className="fas fa-key text-[10px]"></i>
                                            <span>استعادة الحساب بمفتاح الأمان؟</span>
                                        </button>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={loading || availableCenters.length === 0} 
                                        className="w-full bg-gradient-to-l from-[#06B6D4] to-[#3B82F6] text-white font-black py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-cyan-500/25 mt-2 flex justify-center items-center gap-2 disabled:opacity-50 text-base sm:text-lg hover:opacity-95 transition-all active:scale-95"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-sign-in-alt"></i>}
                                        <span>دخول النظام</span>
                                    </button>

                                    {savedUsers.length > 0 && (
                                        <button 
                                            type="button" 
                                            onClick={() => setActiveTab('fast-login')} 
                                            className="w-full text-center text-slate-500 hover:text-slate-800 font-bold text-xs sm:text-sm pt-1 transition"
                                        >
                                            العودة لقائمة الحسابات المحفوظة
                                        </button>
                                    )}
                                </form>
                            )}

                            {/* ================= 3. تأسيس مركز جديد ================= */}
                            {activeTab === 'register' && (
                                <form onSubmit={handleRegister} className="space-y-4 fade-up">
                                    <div className="input-group">
                                        <input 
                                            type="text" 
                                            name="centerName" 
                                            value={formData.centerName} 
                                            onChange={handleChange} 
                                            required 
                                            className="input-field pr-4" 
                                            placeholder="اسم مركز الصيانة" 
                                        />
                                        <i className="fas fa-store input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input 
                                            type="text" 
                                            name="ownerName" 
                                            value={formData.ownerName} 
                                            onChange={handleChange} 
                                            required 
                                            className="input-field pr-4" 
                                            placeholder="اسم مدير المركز (المالك)" 
                                        />
                                        <i className="fas fa-user-tie input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input 
                                            type="tel" 
                                            name="phone" 
                                            value={formData.phone} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right" 
                                            placeholder="رقم الهاتف (لتسجيل الدخول)" 
                                        />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            name="password" 
                                            value={formData.password} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-12" 
                                            placeholder="كلمة المرور" 
                                        />
                                        <i className="fas fa-lock input-icon"></i>
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute top-1/2 right-4 -translate-y-1/2 text-slate-400 hover:text-cyan-600 transition"
                                        >
                                            <i className={`fas fa-eye${showPassword ? '-slash' : ''}`}></i>
                                        </button>
                                    </div>

                                    <div className="p-3 bg-cyan-50/70 border border-cyan-100 rounded-xl text-[11px] font-bold text-cyan-800 leading-relaxed">
                                        <i className="fas fa-shield-alt text-cyan-600 ml-1"></i>
                                        سيتم إنشاء قاعدة بيانات محلية ومستقلة تماماً لهذا المركز على جهازك.
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={loading} 
                                        className="w-full bg-gradient-to-l from-[#06B6D4] to-[#3B82F6] hover:opacity-95 text-white font-black py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-cyan-500/25 mt-2 text-base sm:text-lg transition-all active:scale-95 disabled:opacity-50"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <i className="fas fa-rocket"></i>}
                                        <span>تأسيس المركز الآن</span>
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>

                    {/* ================= 4. نافذة استعادة الحساب بمفتاح الأمان (Security Key Modal) ================= */}
                    {isRecoveryOpen && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center p-3.5 bg-slate-900/80 backdrop-blur-sm animate-view">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden relative text-right">
                                {/* هيدر المودال */}
                                <div className="p-4 sm:p-5 border-b border-slate-100 bg-violet-50/60 flex items-center justify-between">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-10 h-10 rounded-xl bg-violet-600 text-white flex items-center justify-center shadow-md shadow-violet-500/30">
                                            <i className="fas fa-key text-base"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-slate-800 text-sm sm:text-base">استعادة كلمة المرور أوفلاين</h3>
                                            <p className="text-[11px] font-bold text-slate-400">باستخدام مفتاح الأمان المعتمد</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setIsRecoveryOpen(false)}
                                        className="w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition-colors shadow-sm"
                                    >
                                        <i className="fas fa-times text-xs"></i>
                                    </button>
                                </div>

                                {/* محتوى المودال */}
                                <form onSubmit={handleSecurityKeyRecovery} className="p-5 sm:p-6 space-y-4">
                                    {recoveryError && (
                                        <div className="p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs font-bold flex items-start gap-2">
                                            <i className="fas fa-exclamation-circle text-sm mt-0.5 shrink-0"></i>
                                            <span>{recoveryError}</span>
                                        </div>
                                    )}

                                    {recoverySuccess && (
                                        <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl text-xs font-bold flex items-center gap-2">
                                            <i className="fas fa-check-circle text-sm shrink-0"></i>
                                            <span>{recoverySuccess}</span>
                                        </div>
                                    )}

                                    <div className="bg-slate-50 border border-slate-100 p-3 rounded-xl text-slate-500 text-[11px] font-bold leading-relaxed">
                                        <i className="fas fa-info-circle text-violet-600 ml-1"></i>
                                        أدخل مفتاح الأمان (المكون من 12 خانة) الذي تم حفظه مسبقاً في إعدادات النظام لتعيين كلمة مرور جديدة فوراً.
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1.5">مفتاح الأمان (Security Key)</label>
                                        <div className="relative">
                                            <input 
                                                type="text"
                                                dir="ltr"
                                                required
                                                value={recoveryKey}
                                                onChange={(e) => setRecoveryKey(e.target.value.toUpperCase())}
                                                placeholder="مثال: X8K9-M2W4-P7Q3"
                                                className="w-full bg-slate-50 border-2 border-slate-200 focus:border-violet-600 focus:bg-white text-slate-900 font-mono text-center font-black text-base py-3 px-10 rounded-xl outline-none tracking-widest transition-all placeholder:tracking-normal placeholder:font-sans placeholder:text-xs"
                                            />
                                            <i className="fas fa-shield-alt absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1.5">كلمة المرور الجديدة</label>
                                        <div className="relative">
                                            <input 
                                                type="password"
                                                required
                                                dir="ltr"
                                                value={recoveryNewPassword}
                                                onChange={(e) => setRecoveryNewPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full bg-slate-50 border border-slate-200 focus:border-violet-600 focus:bg-white text-slate-900 text-sm font-bold py-2.5 px-10 rounded-xl outline-none transition-all text-left placeholder:text-right"
                                            />
                                            <i className="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1.5">تأكيد كلمة المرور</label>
                                        <div className="relative">
                                            <input 
                                                type="password"
                                                required
                                                dir="ltr"
                                                value={recoveryConfirmPassword}
                                                onChange={(e) => setRecoveryConfirmPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full bg-slate-50 border border-slate-200 focus:border-violet-600 focus:bg-white text-slate-900 text-sm font-bold py-2.5 px-10 rounded-xl outline-none transition-all text-left placeholder:text-right"
                                            />
                                            <i className="fas fa-check-double absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <button 
                                            type="submit"
                                            disabled={recoveryLoading}
                                            className="w-full bg-gradient-to-l from-violet-600 to-indigo-600 hover:opacity-95 text-white font-black py-3.5 rounded-xl shadow-lg shadow-violet-500/25 transition-all flex items-center justify-center gap-2 text-sm sm:text-base active:scale-95 disabled:opacity-50"
                                        >
                                            {recoveryLoading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-key"></i>}
                                            <span>تحديث كلمة المرور والدخول</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SubscriptionsApp />);
    </script>
</body>
</html>
